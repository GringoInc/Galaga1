# ⚠️ TEMPORAL — creado por la sesión remota de Claude Code.
# Aplica ._claude/optimize.patch sobre esta rama (la sesión no tiene git push
# directo y el archivo completo excede el límite por llamada de la API).
# Tras aplicarse, la carpeta ._claude se elimina y este workflow se retira.
name: Aplicar parche temporal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar parche, limpiar y subir
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git apply --verbose ._claude/optimize.patch
          git rm -q -r ._claude
          git add index.html
          git commit -m "⚡ Rendimiento: caché de caras en lienzo fuera de pantalla" -m "Cada personaje (foto recortada o ilustración de decenas de trazos y degradados) se pintaba desde cero en cada cuadro; ahora cada cara se dibuja una sola vez en un lienzo fuera de pantalla y se estampa con un único drawImage por cuadro (la insignia de calavera también se cachea). Además se elimina un filtrado duplicado de balas enemigas por cuadro y un clearRect redundante (el degradado de fondo es opaco y cubre todo el lienzo)." -m "Medido con Chromium headless sin límite de FPS (media de 3 corridas de 8 s): 349.5 -> 546.6 cuadros/s (~36 % menos tiempo por cuadro), sin errores de consola y con render idéntico." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01NN4Av25A3M2m9sMqHoBXcG"
          git push origin HEAD
